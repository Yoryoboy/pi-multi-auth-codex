name: Feature request
description: Propose an approved, reviewable product capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should this solve?
      placeholder: Describe the current behavior and who it affects.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable behavior should the feature provide?
      placeholder: Describe the expected user-facing result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and explicitly excluded?
      placeholder: List the intended boundaries and non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know the feature is complete?
      placeholder: Provide concrete, testable criteria.
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness
      options:
        - label: I have checked for existing issues that cover this request.
          required: true
        - label: This request contains no credentials or private information.
          required: true
